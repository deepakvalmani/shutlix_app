<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - ShutliX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #1A56DB;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #F9FAFB;
            color: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--brand);
        }
        p {
            font-size: 1.1rem;
            color: #4B5563;
            max-width: 400px;
            margin-bottom: 2rem;
        }
        .btn {
            background: var(--brand);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="icon">🚌</div>
    <h1>You're Offline</h1>
    <p>It seems you don't have an internet connection. Some features of ShutliX may be unavailable.</p>
    <a href="/" class="btn">Try Again</a>
    <script>
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
